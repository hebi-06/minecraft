// MMO RPG — Fabric 모드 (마인크래프트 자바 ${minecraft_version}, 난독화 없는 공식 이름)
// 소스: src/main (공통 · 서버), src/client (HUD · 스탯 창 · 키), src/gametest (게임 시험: 서버 @GameTest + 클라이언트 화면 시험 — 모드 jar 에 안 들어감)
// 규칙 코어 (core/ — 밸런스 데이터 rules.json + 계산) 는 모드의 소스로 함께 컴파일해 모드 jar 에 넣음
// (예전처럼 다른 프로젝트 (:core) 의 출력을 jar 에 덧붙이면 배포 jar 에서 빠져 서버 · 게임이 켜지지 않았음 — NoClassDefFoundError: mmorpg/core/Rules)
plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

sourceSets {
    main {
        java { srcDir 'core/src/main/java' }
        resources { srcDir 'core/src/main/resources' }
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "mmorpg" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

// 게임 시험: src/gametest (모드 id mmorpg-gametest) — 서버 시험은 runGameTest, 클라이언트 화면 시험은 runClientGameTest
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "mmorpg-gametest"
        enableGameTests = true
        enableClientGameTests = true
        eula = true
    }
}

repositories {
    // Polymer (eu.pb4) — 2026-11-07 1번 모드 없이 접속
    maven { url = 'https://maven.nucleoid.xyz' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // 모드 jar 안에 같이 넣음 (서버 · 모드 클라이언트 모두 따로 설치할 것 없음). core 는 networking · 레지스트리 동기화 조작 (rsm) 을,
    // virtual-entity · resource-pack 은 common 을 안에 넣어 배포함 — autohost · blocks 는 resource-pack 을 넣지 않아 여기서 넣음
    // (blocks: 제단처럼 그림이 있는 큰 블록을 바닐라 블록 상태 하나에 우리 모델로 — 리소스 팩이 그 상태를 바꿔 그림)
    for (String m : ['polymer-core', 'polymer-virtual-entity', 'polymer-resource-pack', 'polymer-autohost', 'polymer-blocks']) {
        implementation "eu.pb4:${m}:${project.polymer_version}"
        include "eu.pb4:${m}:${project.polymer_version}"
    }
}

processResources {
    def version = project.version
    inputs.property "version", version
    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
    it.options.compilerArgs += ['-Xmaxerrs', '1000', '-XDshould-stop.ifError=FLOW']
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

// 배포 환경 화면 시험 (CI): 실제 설치와 같게 배포 jar + Fabric API jar (+ 시험 모드 jar) 로 클라이언트를 띄워 RpgProdSmoke 만 (-Dmmorpg.prodSmoke=true)
configurations {
    prodMods {
        transitive = false
    }
}

dependencies {
    prodMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // 시험 모듈은 Fabric API 묶음 jar 에 들어 있지 않음 (배포 설치에는 필요 없음 — 이 시험에만)
    prodMods fabricApi.module("fabric-gametest-api-v1", project.fabric_version)
    prodMods fabricApi.module("fabric-client-gametest-api-v1", project.fabric_version)
}

// 화면 시험 중 고른 것만 (CI 수동 실행의 only 입력 → 환경 변수 MMORPG_ONLY → -Dmmorpg.only)
loom.runs.configureEach {
    vmArg "-Dmmorpg.only=${System.getenv('MMORPG_ONLY') ?: ''}"
}

tasks.register('gametestJar', Jar) {
    archiveClassifier = 'gametest'
    destinationDirectory = layout.buildDirectory.dir('gametest-libs')
    from sourceSets.gametest.output
}

tasks.register('prodClient', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    mods.from(configurations.prodMods)
    mods.from(tasks.named('gametestJar'))
    jvmArgs.add('-Dfabric.client.gametest')
    jvmArgs.add('-Dmmorpg.prodSmoke=true')
}

// 2026-11-07 1번 (모드 없이 접속) 시험 — 모드 없는 클라이언트 (바닐라 + 사진만 찍는 작은 모드 src/probe: Fabric API 없이 Fabric Loader 만,
// 서버가 보기에 바닐라와 같음). 배포 서버 (모드 jar) 가 장면을 움직이고 채팅 신호 ("[probe] shot 이름") 를 보내면 찍음 — ci/vanilla_probe.sh
sourceSets {
    probe {
        compileClasspath += sourceSets.client.compileClasspath
    }
}

tasks.register('probeJar', Jar) {
    archiveClassifier = 'probe'
    destinationDirectory = layout.buildDirectory.dir('probe-libs')
    from sourceSets.probe.output
}

tasks.register('probeClient', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    mods.setFrom(tasks.named('probeJar')) // 모드 jar · Fabric API 를 넣지 않음
    runDir.set(layout.projectDirectory.dir('run-probe'))
    programArgs.addAll(['--quickPlayMultiplayer', '127.0.0.1:25565', '--username', 'Probe', '--width', '1280', '--height', '720'])
}

