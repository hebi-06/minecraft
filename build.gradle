// MMO RPG — Fabric 모드 (마인크래프트 자바 ${minecraft_version}, 난독화 없는 공식 이름)
// 소스: src/main (공통 · 서버), src/client (HUD · 스탯 창 · 키), src/gametest (게임 시험: 서버 @GameTest + 클라이언트 화면 시험 — 모드 jar 에 안 들어감)
// 규칙 코어 (:core — 밸런스 데이터 rules.json + 계산) 는 모드 jar 에 함께 넣음
plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "mmorpg" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

// 게임 시험: src/gametest (모드 id mmorpg-gametest) — 서버 시험은 runGameTest, 클라이언트 화면 시험은 runClientGameTest
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "mmorpg-gametest"
        enableGameTests = true
        enableClientGameTests = true
        eula = true
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    implementation project(':core')
}

processResources {
    def version = project.version
    inputs.property "version", version
    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
    it.options.compilerArgs += ['-Xmaxerrs', '1000']
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    // 규칙 코어의 클래스 · rules.json 을 모드 jar 안에
    from(project(':core').sourceSets.main.output)
}
