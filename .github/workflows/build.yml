# 빌드 · 시험 · 배포 (main · mc-* 에 올릴 때마다)
# 1. Fabric 버전 확인  2. 규칙 코어 대조 시험 (애드온 JS 와 같은 값)  3. 모드 빌드 (컴파일, 시험 코드 포함)
# 3b. 배포 jar 로 진짜 Fabric 서버 켜 보기 (실제 설치와 같게)  4. 게임 시험 (서버를 띄워 @GameTest)  5. 화면 시험 (클라이언트를 xvfb 로 띄워 실제 입력 · 확인 항목 · 장면 사진)
# 6. 로그 · 사진을 ci-logs 브랜치에 (늘)  7. 모두 통과하면 릴리스에 모드 jar (main → latest, mc-* → release-<브랜치>)
name: build

on:
  push:
    branches: [main, 'mc-*']
  workflow_dispatch:
    inputs:
      tests:
        description: '게임 시험 · 화면 시험도 (끄면 컴파일만 — 작업 브랜치에서 빠르게 확인)'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: gradle/actions/setup-gradle@v4

      - name: Fabric versions
        id: versions
        run: |
          mkdir -p ci-out
          python3 ci/resolve_versions.py 2>&1 | tee ci-out/versions.txt

      - name: Rules core parity
        id: core
        run: ./check-core.sh 2>&1 | tee ci-out/core.txt

      - name: Build mod
        id: build
        run: ./gradlew assemble gametestClasses --stacktrace --console=plain 2>&1 | tee ci-out/build.txt

      - name: Production server
        id: prod
        run: bash ci/prod_smoke.sh 2>&1 | tee ci-out/prod.txt

      - name: Game tests
        id: gametest
        if: github.event_name != 'workflow_dispatch' || inputs.tests
        run: ./gradlew runGameTest --stacktrace --console=plain 2>&1 | tee ci-out/gametest.txt

      - name: Client screenshots
        id: client
        if: github.event_name != 'workflow_dispatch' || inputs.tests
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1 libgl1-mesa-dri libglx-mesa0 libegl1 mesa-vulkan-drivers libvulkan1 > /dev/null
          mkdir -p ci-out/shots
          set +e
          timeout 1500 xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew runClientGameTest --stacktrace --console=plain 2>&1 | tee ci-out/client.txt
          code=${PIPESTATUS[0]}
          set -e
          cp build/run/clientGameTest/screenshots/*.png ci-out/shots/ 2>/dev/null || true
          cp build/run/clientGameTest/logs/latest.log ci-out/client-latest.log 2>/dev/null || true
          ls -la ci-out/shots
          grep -E "\[client-test\]" ci-out/client.txt ci-out/client-latest.log 2>/dev/null | sort -u > ci-out/client-checks.txt || true
          exit $code

      - name: Publish logs
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OUT_VERSIONS: ${{ steps.versions.outcome }}
          OUT_CORE: ${{ steps.core.outcome }}
          OUT_BUILD: ${{ steps.build.outcome }}
          OUT_PROD: ${{ steps.prod.outcome }}
          OUT_GAMETEST: ${{ steps.gametest.outcome }}
          OUT_CLIENT: ${{ steps.client.outcome }}
        run: bash ci/publish_logs.sh

      - name: Release jar
        # 배포는 main · mc-* 에서 시험까지 다 돈 것만 (작업 브랜치 · 컴파일만 한 것은 배포하지 않음)
        if: success() && (github.ref_name == 'main' || startsWith(github.ref_name, 'mc-')) && (github.event_name != 'workflow_dispatch' || inputs.tests)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          SHORT=${GITHUB_SHA::7}
          MC=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          # main → "latest" (늘 새로), mc-* 브랜치 (옛 마인크래프트 버전 보관) → 브랜치 이름의 릴리스
          if [ "$GITHUB_REF_NAME" = "main" ]; then TAG=latest; PRE=--prerelease; TITLE="최신 빌드 ($SHORT)"; else TAG="release-$GITHUB_REF_NAME"; PRE=; TITLE="$GITHUB_REF_NAME 판 ($SHORT)"; fi
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "$JAR" $PRE --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes "$GITHUB_REF_NAME 의 $SHORT 에서 자동으로 만든 모드 jar. 마인크래프트 자바 $MC · Fabric Loader · Fabric API 가 필요합니다 (ci-out/versions.txt)."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mmorpg-build
          path: |
            build/libs/*.jar
            ci-out/
          if-no-files-found: warn
