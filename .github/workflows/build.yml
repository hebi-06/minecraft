# 빌드 · 시험 · 배포 (main · mc-* 에 올릴 때마다)
# build 일: 1. Fabric 버전 확인  2. 규칙 코어 대조 시험 (애드온 JS 와 같은 값)  3. 모드 빌드 (컴파일, 시험 코드 포함)
#   3b. 배포 jar 로 진짜 Fabric 서버 켜 보기 (실제 설치와 같게)  4. 게임 시험 (서버를 띄워 @GameTest)
# client 일 (묶음마다 동시에 — ci/gallery_groups.py): 5. 화면 시험 (클라이언트를 xvfb 로 띄워 실제 입력 · 확인 항목 · 장면 사진), 한 묶음은 배포 환경 클라이언트도
# publish 일: 6. 로그 · 사진을 ci-logs 브랜치에 (늘)  7. 모두 통과하면 릴리스에 모드 jar (main → latest, mc-* → release-<브랜치>)
name: build

on:
  push:
    branches: [main, 'mc-*']
  workflow_dispatch:
    inputs:
      tests:
        description: '게임 시험 · 화면 시험도 (끄면 컴파일만 — 작업 브랜치에서 빠르게 확인)'
        type: boolean
        default: true
      only:
        description: '화면 시험 중 이것만 (쉼표: client weapon particle skill rune gear form nav mob arena boss monster tree scorpions kraken worm jorm nidhogg skoll ymir surtr mount pvp stattree runebreak mob9 hero skillbar weapons12 cosmetic gacha job prod — 세미콜론으로 동시에 돌 묶음, 비우면 모두, none 이면 사진첩 없이)'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      compiled: ${{ steps.build.outcome == 'success' }}
      groups: ${{ steps.plan.outputs.groups }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: gradle/actions/setup-gradle@v4

      - name: Fabric versions
        id: versions
        run: |
          mkdir -p ci-out
          python3 ci/resolve_versions.py 2>&1 | tee ci-out/versions.txt

      - name: Rules core parity
        id: core
        run: ./check-core.sh 2>&1 | tee ci-out/core.txt

      - name: Build mod
        id: build
        run: ./gradlew assemble gametestClasses --stacktrace --console=plain 2>&1 | tee ci-out/build.txt

      - name: Production server
        id: prod
        run: bash ci/prod_smoke.sh 2>&1 | tee ci-out/prod.txt

      - name: Game tests
        id: gametest
        if: github.event_name != 'workflow_dispatch' || inputs.tests
        run: ./gradlew runGameTest --stacktrace --console=plain 2>&1 | tee ci-out/gametest.txt

      - name: Gallery groups
        id: plan
        if: always()
        run: |
          if [ "${{ github.event_name != 'workflow_dispatch' || inputs.tests }}" = "true" ]; then
            python3 ci/gallery_groups.py "${{ inputs.only }}" | tee -a "$GITHUB_OUTPUT"
          else
            echo "groups=[]" | tee -a "$GITHUB_OUTPUT"
          fi

      - name: Outcomes
        if: always()
        run: |
          mkdir -p ci-out
          {
            echo "versions: ${{ steps.versions.outcome }}"
            echo "core: ${{ steps.core.outcome }}"
            echo "build: ${{ steps.build.outcome }}"
            echo "prod: ${{ steps.prod.outcome }}"
            echo "gametest: ${{ steps.gametest.outcome }}"
          } > ci-out/outcome-0build.txt

      # build 일의 로그 (빌드 · 게임 시험) 를 바로 ci-logs-build 브랜치에도 (main 에서 아래 캐시가 지워지면 publish 일의 ci-logs 에 빠지므로)
      - name: Publish build logs
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_LOGS_BRANCH: ci-logs-build
          OUT_CLIENT_ALL: (build job only)
        run: bash ci/publish_logs.sh

      # 일 사이에 넘기는 파일 (로그 · 사진 · jar): 아티팩트 대신 캐시 (아티팩트 저장 공간 한도에 걸리지 않게 — 캐시는 10GB 안에서 오래된 것부터 지워짐)
      - uses: actions/cache/save@v4
        if: always()
        with:
          key: ci-${{ github.run_id }}-build-${{ github.run_attempt }}
          path: |
            ci-out
            build/libs

  client:
    # 컴파일이 되면 게임 시험이 실패해도 사진은 찍음 (사진으로 확인할 수 있게) — 배포는 publish 에서 모두 통과해야
    name: client (${{ matrix.name }})
    needs: build
    if: always() && needs.build.outputs.compiled == 'true' && needs.build.outputs.groups != '[]' && needs.build.outputs.groups != ''
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.build.outputs.groups) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # 화면 시험 묶음은 gradle 캐시를 읽기만 (main 에서 묶음 여덟이 저마다 큰 gradle 캐시를 쓰면 저장소 캐시 10GB 를 넘겨
      # build 일이 넣은 jar · 로그 캐시가 publish 전에 지워짐 — 2026-10-12 0.9.0 배포가 jar 를 못 찾음)
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Client screenshots
        id: client
        if: matrix.only != 'none'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MMORPG_ONLY: ${{ matrix.only }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1 libgl1-mesa-dri libglx-mesa0 libegl1 mesa-vulkan-drivers libvulkan1 > /dev/null
          mkdir -p ci-out/shots
          N=${{ matrix.name }}
          # 멈춤 진단: 시간 초과 (45분) 직전 42분에 자바 프로세스마다 스레드 덤프 → ci-out/threads-<묶음>-<pid>.txt (2026-10 ui 묶음이 사진첩 끝에서 두 번 멈춤 — 두 번째 (0.12.2) 는 파티클 사진첩이 세계를 닫을 때: 렌더 스레드는 IntegratedServer.halt, 서버 · 시험 스레드는 Fabric ThreadingImpl.enterPhase 에서 서로 기다림. 코드와 무관 — 실패한 작업만 다시 돌리면 지나감)
          ( sleep 2520; for p in $(pgrep -f java || true); do "$JAVA_HOME/bin/jcmd" "$p" Thread.print > "ci-out/threads-$N-$p.txt" 2>&1 || true; done ) &
          WATCH=$!
          set +e
          timeout 2700 xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew runClientGameTest --stacktrace --console=plain 2>&1 | tee ci-out/client-$N.txt
          code=${PIPESTATUS[0]}
          kill $WATCH 2>/dev/null
          set -e
          for f in build/run/clientGameTest/screenshots/*.png; do [ -f "$f" ] && cp "$f" "ci-out/shots/${N}_$(basename "$f")"; done
          # 0.48.2 스킬 영상 (only=film,…): 틱마다 찍은 사진 → 스킬마다 mp4 (ci/films.py — ci-out/films, 사진은 지움)
          if [ -d build/run/clientGameTest/films ]; then
            sudo apt-get install -y -qq ffmpeg > /dev/null
            python3 ci/films.py build/run/clientGameTest/films ci-out/films "${N}_" | tee ci-out/films-$N.txt || true
          fi
          cp build/run/clientGameTest/logs/latest.log ci-out/client-$N-latest.log 2>/dev/null || true
          ls -la ci-out/shots
          grep -h -E "\[[a-z-]+(-test|-gallery)\] (done|FAIL|stopped)" ci-out/client-$N.txt ci-out/client-$N-latest.log 2>/dev/null | sort -u > ci-out/client-checks-$N.txt || true
          exit $code

      - name: Production client
        id: prodclient
        # 배포 jar 로 진짜 클라이언트 (Fabric 설치와 같게) — 실패해도 배포는 막지 않음 (로그 · 사진으로 확인)
        if: matrix.prod
        continue-on-error: true
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          sudo apt-get install -y -qq xvfb libgl1 libgl1-mesa-dri libglx-mesa0 libegl1 mesa-vulkan-drivers libvulkan1 > /dev/null
          set +e
          timeout 1500 ./gradlew prodClient --stacktrace --console=plain 2>&1 | tee ci-out/prod-client.txt
          code=${PIPESTATUS[0]}
          set -e
          mkdir -p ci-out/shots
          find build -name '*prod_*.png' -exec cp {} ci-out/shots/ \; 2>/dev/null || true
          for f in $(find build/run -path '*prod*' -name latest.log 2>/dev/null); do cp "$f" ci-out/prod-client-latest.log; done
          grep -h -E "\[prod-client\]" ci-out/prod-client.txt ci-out/prod-client-latest.log 2>/dev/null | sort -u || true
          grep -h -q "\[prod-client\] done, 0 failed" ci-out/prod-client.txt ci-out/prod-client-latest.log 2>/dev/null || code=1
          exit $code

      - name: Outcomes
        if: always()
        run: |
          mkdir -p ci-out
          echo "client ${{ matrix.name }} (${{ matrix.only }}): ${{ steps.client.outcome }}" > ci-out/outcome-client-${{ matrix.name }}.txt
          if [ "${{ matrix.prod }}" = "true" ]; then echo "prod-client: ${{ steps.prodclient.outcome }}" >> ci-out/outcome-client-${{ matrix.name }}.txt; fi

      - uses: actions/cache/save@v4
        if: always()
        with:
          key: ci-${{ github.run_id }}-client-${{ matrix.name }}-${{ github.run_attempt }}
          path: ci-out

  publish:
    needs: [build, client]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 빌드 · 묶음마다 캐시에 넣은 파일을 모음 (다시 돌린 일은 가장 늦은 시도 — restore-keys 앞머리)
      - uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          key: ci-${{ github.run_id }}-build-${{ github.run_attempt }}
          restore-keys: ci-${{ github.run_id }}-build-
          path: |
            ci-out
            build/libs
      - uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          key: ci-${{ github.run_id }}-client-ui-${{ github.run_attempt }}
          restore-keys: ci-${{ github.run_id }}-client-ui-
          path: ci-out
      - uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          key: ci-${{ github.run_id }}-client-rune-${{ github.run_attempt }}
          restore-keys: ci-${{ github.run_id }}-client-rune-
          path: ci-out
      - uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          key: ci-${{ github.run_id }}-client-world-${{ github.run_attempt }}
          restore-keys: ci-${{ github.run_id }}-client-world-
          path: ci-out
      - uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          key: ci-${{ github.run_id }}-client-sk-${{ github.run_attempt }}
          restore-keys: ci-${{ github.run_id }}-client-sk-
          path: ci-out
      - uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          key: ci-${{ github.run_id }}-client-wj-${{ github.run_attempt }}
          restore-keys: ci-${{ github.run_id }}-client-wj-
          path: ci-out
      - uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          key: ci-${{ github.run_id }}-client-ns-${{ github.run_attempt }}
          restore-keys: ci-${{ github.run_id }}-client-ns-
          path: ci-out
      - uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          key: ci-${{ github.run_id }}-client-ys-${{ github.run_attempt }}
          restore-keys: ci-${{ github.run_id }}-client-ys-
          path: ci-out
      - uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          key: ci-${{ github.run_id }}-client-six-${{ github.run_attempt }}
          restore-keys: ci-${{ github.run_id }}-client-six-
          path: ci-out
      - uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          key: ci-${{ github.run_id }}-client-hero-${{ github.run_attempt }}
          restore-keys: ci-${{ github.run_id }}-client-hero-
          path: ci-out
      - uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          key: ci-${{ github.run_id }}-client-w12-${{ github.run_attempt }}
          restore-keys: ci-${{ github.run_id }}-client-w12-
          path: ci-out
      - uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          key: ci-${{ github.run_id }}-client-g1-${{ github.run_attempt }}
          restore-keys: ci-${{ github.run_id }}-client-g1-
          path: ci-out
      - uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          key: ci-${{ github.run_id }}-client-g2-${{ github.run_attempt }}
          restore-keys: ci-${{ github.run_id }}-client-g2-
          path: ci-out
      - uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          key: ci-${{ github.run_id }}-client-g3-${{ github.run_attempt }}
          restore-keys: ci-${{ github.run_id }}-client-g3-
          path: ci-out
      - uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          key: ci-${{ github.run_id }}-client-g4-${{ github.run_attempt }}
          restore-keys: ci-${{ github.run_id }}-client-g4-
          path: ci-out
      - uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          key: ci-${{ github.run_id }}-client-g5-${{ github.run_attempt }}
          restore-keys: ci-${{ github.run_id }}-client-g5-
          path: ci-out
      - uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          key: ci-${{ github.run_id }}-client-g6-${{ github.run_attempt }}
          restore-keys: ci-${{ github.run_id }}-client-g6-
          path: ci-out

      - name: Publish logs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OUT_CLIENT_ALL: ${{ needs.client.result }}
        run: bash ci/publish_logs.sh

      # 캐시에서 jar 가 지워졌으면 같은 커밋에서 다시 만듦 (배포 조건일 때만)
      - uses: actions/setup-java@v4
        if: needs.build.result == 'success' && needs.client.result == 'success' && (github.ref_name == 'main' || startsWith(github.ref_name, 'mc-')) && (github.event_name != 'workflow_dispatch' || inputs.tests)
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        if: needs.build.result == 'success' && needs.client.result == 'success' && (github.ref_name == 'main' || startsWith(github.ref_name, 'mc-')) && (github.event_name != 'workflow_dispatch' || inputs.tests)
        with:
          cache-read-only: true

      - name: Release jar
        # 배포는 main · mc-* 에서 시험까지 다 돈 것만 (작업 브랜치 · 컴파일만 한 것은 배포하지 않음)
        if: needs.build.result == 'success' && needs.client.result == 'success' && (github.ref_name == 'main' || startsWith(github.ref_name, 'mc-')) && (github.event_name != 'workflow_dispatch' || inputs.tests)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          if ! ls build/libs/*.jar > /dev/null 2>&1; then
            echo "jar not restored from the build cache (evicted?) — building it again from $GITHUB_SHA"
            ./gradlew assemble --console=plain
          fi
          ls -la build/libs
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          [ -n "$JAR" ] || { echo "no jar"; exit 1; }
          SHORT=${GITHUB_SHA::7}
          MC=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          # main → "latest" (늘 새로), mc-* 브랜치 (옛 마인크래프트 버전 보관) → 브랜치 이름의 릴리스
          if [ "$GITHUB_REF_NAME" = "main" ]; then TAG=latest; PRE=--prerelease; TITLE="최신 빌드 ($SHORT)"; else TAG="release-$GITHUB_REF_NAME"; PRE=; TITLE="$GITHUB_REF_NAME 판 ($SHORT)"; fi
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "$JAR" $PRE --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes "$GITHUB_REF_NAME 의 $SHORT 에서 자동으로 만든 모드 jar. 마인크래프트 자바 $MC · Fabric Loader · Fabric API 가 필요합니다 (ci-out/versions.txt)."

      - name: Overall
        # 실행 전체의 성공 · 실패 (빌드 · 게임 시험 · 화면 시험 묶음 중 하나라도 실패면 실패)
        if: always()
        run: |
          echo "build: ${{ needs.build.result }}  client: ${{ needs.client.result }}"
          [ "${{ needs.build.result }}" = "success" ] && { [ "${{ needs.client.result }}" = "success" ] || [ "${{ needs.client.result }}" = "skipped" ]; }
