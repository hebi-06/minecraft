# 마인크래프트 · Fabric API 시그니처 목록 (javap) 을 api-dump 브랜치에 — 버전을 옮길 때 참고용 (수동 실행 또는 ci/api-dump 를 바꿔 올릴 때)
name: api-dump

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['ci/api-dump/**', '.github/workflows/api-dump.yml']

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Resolve Minecraft 26.3
        working-directory: ci/api-dump
        run: gradle --no-daemon printClasspath --console=plain --stacktrace 2>&1 | tail -40
      - name: Dump signatures
        run: bash ci/api-dump/dump.sh
      - name: Publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd /tmp/api
          git init -q -b api-dump
          git config user.name ci
          git config user.email ci@users.noreply.github.com
          git add -A
          git commit -q -m "api dump ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" api-dump && echo pushed
